<!-- GitHub Sync Section -->
    <div class="settings-section">
      <h3>☁️ Synchronizacja GitHub Gist</h3>

      <div class="setting-item">
        <label class="setting-label">GitHub Personal Access Token</label>
        <input type="password" class="setting-input" data-input="github-token" placeholder="ghp_xxxxxxxxxxxxx" style="width: 100%; max-width: 500px;">
      </div>

      <div class="setting-item">
        <label class="setting-label">ID Gista</label>
        <input type="text" class="setting-input" data-input="gist-id" placeholder="np. a1b2c3d4e5f6..." style="width: 100%; max-width: 500px;">
      </div>

      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" data-input="auto-sync">
          Automatyczna synchronizacja (co 5 min)
        </label>
      </div>

      <div class="button-container">
        <button class="btn btn-primary" data-action="save-token">💾 Zapisz Token</button>
        <button class="btn btn-danger" data-action="remove-token">🗑️ Usuń Token</button>
        <button class="btn btn-success" data-action="save-gist">☁️ Zapisz do chmury</button>
        <button class="btn btn-primary" data-action="load-gist">🔍 Pobierz z chmury</button>
      </div>

      <div class="sync-status" data-sync-status></div>
      <div data-gist-info style="margin-top: 10px; font-size: 0.85em; color: #666;"></div>

      <div style="margin-top: 15px; padding: 15px; background: #e3f2fd; border-radius: 6px; font-size: 0.9em;">
        <strong>📝 Jak uzyskać token?</strong><br>
        1. Przejdź do GitHub → Settings → Developer settings<br>
        2. Personal access tokens → Tokens (classic) → Generate new token<br>
        3. Zaznacz tylko uprawnienie <strong>"gist"</strong><br>
        4. Skopiuj wygenerowany token i wklej powyżej
      </div>
    </div>
